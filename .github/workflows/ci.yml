name: CI

# Executa build, testes de arquitetura, testes unitarios e testes de integracao.
# Atende ao Requisito 6: a cada pull request para `develop` o pipeline valida a solucao.
on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop"]

# Cancela execucoes antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mantem a versao alinhada com global.json (SDK 10.0.x, canal LTS).
  DOTNET_VERSION: "10.0.x"
  SOLUTION: "OrderHub.slnx"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    name: Build, Test & Architecture
    # ubuntu-latest ja fornece o Docker daemon necessario para o Testcontainers.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      # TreatWarningsAsErrors vem de Directory.Build.props; qualquer warning quebra o build.
      - name: Build (Release, warnings-as-errors)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      # Testes de arquitetura (NetArchTest) + unitarios: nao dependem de Docker.
      - name: Architecture tests
        run: >-
          dotnet test tests/OrderHub.Catalog.Architecture.Tests/OrderHub.Catalog.Architecture.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=architecture-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      # Testes de integracao com Testcontainers: exigem o Docker daemon do runner.
      - name: Integration tests (Testcontainers)
        run: >-
          dotnet test tests/catalog/OrderHub.Catalog.Api.IntegrationTests/OrderHub.Catalog.Api.IntegrationTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/test-results/**/*.trx
          if-no-files-found: warn
