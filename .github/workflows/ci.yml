name: CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-test:
    name: Build, Test & Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore OrderHub.sln

      - name: Build
        run: dotnet build OrderHub.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test OrderHub.sln --no-build --configuration Release --filter "Category!=Integration" --logger "trx;LogFileName=unit-results.trx"

      - name: Architecture tests
        run: dotnet test OrderHub.sln --no-build --configuration Release --filter "Category=Architecture" --logger "trx;LogFileName=arch-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
