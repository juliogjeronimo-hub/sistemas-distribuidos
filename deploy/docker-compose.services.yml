# ─── Serviços .NET ────────────────────────────────────────────────────────────
# Gateway (YARP) e Catalog (API). Construídos a partir dos Dockerfiles locais.
# Integram-se com a infraestrutura base (Keycloak, RabbitMQ, Redis, etc).
#
# As portas e configurações de dev são declaradas em docker-compose.override.yml.

name: orderhub

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
  data:
    driver: bridge

volumes:
  postgres-catalog-data:

services:

  # ─── PostgreSQL (Catalog) ──────────────────────────────────────────────────
  # Dedicated PostgreSQL 17 instance for the Catalog service.
  # Lives on the "data" network, not exposed to host except in "debug" profile.
  # Health check ensures the database is ready before the Catalog starts.
  postgres-catalog:
    image: postgres:17-alpine
    container_name: orderhub-postgres-catalog
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderhub}
      POSTGRES_DB: orderhub_catalog
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orderhub", "-d", "orderhub_catalog"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  # ─── Gateway ──────────────────────────────────────────────────────────────
  # YARP (reverse proxy). Ponto de entrada único para a plataforma.
  # Orquestra rotas para Catalog e futuros serviços, injeta trace headers,
  # valida JWT (delegado ao JwtBearer middleware).
  #
  # Port mapping e ASPNETCORE_ENVIRONMENT: declarados em docker-compose.override.yml.
  gateway:
    build:
      context: ../
      dockerfile: src/Gateway/OrderHub.Gateway/Dockerfile
    container_name: orderhub-gateway
    environment:
      Auth:ValidIssuer: "http://keycloak:8080/realms/orderhub"
      Auth:Audience: "orderhub-api"
      Auth:RequireHttpsMetadata: "false"
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - edge
      - internal
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  # ─── Catalog ──────────────────────────────────────────────────────────────
  # API de produtos. Esqueleto funcional com autenticação JWT.
  # Fase 02a: login de usuários e validação de tokens.
  # Fase 02b: persistência em banco com EF Core.
  #
  # Port mapping e ASPNETCORE_ENVIRONMENT: declarados em docker-compose.override.yml.
  catalog:
    build:
      context: ../
      dockerfile: src/Catalog/OrderHub.Catalog.Api/Dockerfile
    container_name: orderhub-catalog
    environment:
      Auth:ValidIssuer: "http://keycloak:8080/realms/orderhub"
      Auth:Audience: "orderhub-api"
      Auth:RequireHttpsMetadata: "false"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Catalog: "Host=postgres-catalog;Port=5432;Username=${POSTGRES_USER:-orderhub};Password=${POSTGRES_PASSWORD:-orderhub};Database=orderhub_catalog;"
    networks:
      - internal
      - data
    depends_on:
      keycloak:
        condition: service_healthy
      postgres-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped
