# ─── Serviços .NET ────────────────────────────────────────────────────────────
# Overlay dos serviços .NET sobre a plataforma de infra definida no
# docker-compose.yml. Usar sempre junto com o base:
#
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up
#
# As imagens são construídas a partir do código-fonte; o build context é a
# raiz do repositório para que o Directory.Build.props seja alcançável.
#
# Redes e volumes são declarados no base (docker-compose.yml); este arquivo
# apenas acrescenta/ajusta os serviços .NET. As portas de host ficam no
# docker-compose.override.yml (dev).

name: orderhub

services:

  # ─── Gateway (YARP) ───────────────────────────────────────────────────────
  # Borda pública: fica em "edge" (alcançável de fora) e em "internal" (para
  # falar com o Catalog e validar JWT no Keycloak).
  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/OrderHub.Gateway/Dockerfile
    image: orderhub/gateway:1.0.0
    container_name: orderhub-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Endereços dos serviços de upstream — ajuste conforme a config do YARP.
      ReverseProxy__Clusters__catalog__Destinations__catalog__Address: http://catalog:8080
      Auth__Authority: ${AUTH_AUTHORITY:-http://keycloak:8080/realms/orderhub}
      Auth__Audience: ${AUTH_AUDIENCE:-orderhub-api}
      Auth__RequireHttpsMetadata: "false"
      Telemetry__ServiceName: gateway
      Telemetry__ServiceVersion: "1.0.0"
    networks:
      - edge
      - internal
    depends_on:
      keycloak:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  # ─── Catalog ──────────────────────────────────────────────────────────────
  # Serviço interno: fica apenas em "internal". Valida JWT no Keycloak, por isso
  # depende dele saudável. O banco próprio do Catalog chega na fase do serviço;
  # nesta fase ainda não há Postgres no stack.
  catalog:
    build:
      context: ..
      dockerfile: src/Catalog/OrderHub.Catalog.Api/Dockerfile
    image: orderhub/catalog:1.0.0
    container_name: orderhub-catalog
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__Authority: ${AUTH_AUTHORITY:-http://keycloak:8080/realms/orderhub}
      Auth__Audience: ${AUTH_AUDIENCE:-orderhub-api}
      Auth__RequireHttpsMetadata: "false"
      Telemetry__ServiceName: catalog
      Telemetry__ServiceVersion: "1.0.0"
    networks:
      - internal
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped
