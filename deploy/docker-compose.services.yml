# ─── Serviços .NET ────────────────────────────────────────────────────────────
# Gateway (YARP) e Catalog (API). Construídos a partir dos Dockerfiles locais.
# Integram-se com a infraestrutura base (Keycloak, RabbitMQ, Redis, etc).
#
# As portas e configurações de dev são declaradas em docker-compose.override.yml.

name: orderhub

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

services:

  # ─── Gateway ──────────────────────────────────────────────────────────────
  # YARP (reverse proxy). Ponto de entrada único para a plataforma.
  # Orquestra rotas para Catalog e futuros serviços, injeta trace headers,
  # valida JWT (delegado ao JwtBearer middleware).
  #
  # Port mapping e ASPNETCORE_ENVIRONMENT: declarados em docker-compose.override.yml.
  gateway:
    build:
      context: ../
      dockerfile: src/Gateway/OrderHub.Gateway/Dockerfile
    container_name: orderhub-gateway
    environment:
      Auth:ValidIssuer: "http://keycloak:8080/realms/orderhub"
      Auth:Audience: "orderhub-api"
      Auth:RequireHttpsMetadata: "false"
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - edge
      - internal
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  # ─── Catalog ──────────────────────────────────────────────────────────────
  # API de produtos. Esqueleto funcional com autenticação JWT.
  # Fase 02a: login de usuários e validação de tokens.
  # Fase 02b: persistência em banco com EF Core.
  #
  # Port mapping e ASPNETCORE_ENVIRONMENT: declarados em docker-compose.override.yml.
  catalog:
    build:
      context: ../
      dockerfile: src/Catalog/OrderHub.Catalog.Api/Dockerfile
    container_name: orderhub-catalog
    environment:
      Auth:ValidIssuer: "http://keycloak:8080/realms/orderhub"
      Auth:Audience: "orderhub-api"
      Auth:RequireHttpsMetadata: "false"
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - internal
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped
