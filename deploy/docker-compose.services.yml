# ─── Serviços .NET ────────────────────────────────────────────────────────────
# Usar junto com a infra:
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up
#
# As imagens são construídas a partir do código-fonte; o build context é a
# raiz do repositório para que o Directory.Build.props seja alcançável.

name: orderhub

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
  data:
    driver: bridge

services:

  # ─── Gateway (YARP) ───────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/OrderHub.Gateway/Dockerfile
    image: orderhub/gateway:1.0.0
    container_name: orderhub-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Endereços dos serviços de upstream — ajuste conforme a config do YARP.
      ReverseProxy__Clusters__catalog__Destinations__catalog__Address: http://catalog:8080
      Auth__Authority: ${AUTH_AUTHORITY:-http://keycloak:8080/realms/orderhub}
      Auth__Audience: ${AUTH_AUDIENCE:-orderhub-api}
      Telemetry__ServiceName: gateway
      Telemetry__ServiceVersion: "1.0.0"
    networks:
      - edge
      - internal
    depends_on:
      keycloak:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  # ─── Catalog ──────────────────────────────────────────────────────────────
  catalog:
    build:
      context: ..
      dockerfile: src/Catalog/OrderHub.Catalog.Api/Dockerfile
    image: orderhub/catalog:1.0.0
    container_name: orderhub-catalog
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Catalog: >-
        Host=postgres-catalog;Port=5432;Database=catalog;
        Username=catalog;Password=${POSTGRES_CATALOG_PASSWORD:-changeme_dev}
      Auth__Authority: ${AUTH_AUTHORITY:-http://keycloak:8080/realms/orderhub}
      Auth__Audience: ${AUTH_AUDIENCE:-orderhub-api}
      Telemetry__ServiceName: catalog
      Telemetry__ServiceVersion: "1.0.0"
    networks:
      - internal
    depends_on:
      postgres-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped
