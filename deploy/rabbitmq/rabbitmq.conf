# ─── RabbitMQ — server configuration ──────────────────────────────────────────
# Mounted read-only into the broker image at /etc/rabbitmq/rabbitmq.conf.
# Keep broker-wide defaults here; per-service topology is declared by each
# service's code, not pre-created in this file.

# New queues default to the quorum type (replicated, Raft-based), matching the
# project's fault-tolerance goals. Classic queues can still be declared
# explicitly by a client when needed.
default_queue_type = quorum
