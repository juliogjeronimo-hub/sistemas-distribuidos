# ─── Serviços .NET: Catalog e Gateway (hello world) ───────────────────────────
# Para subir todo o stack infra + serviços, use docker-compose.services.yml.
# Este arquivo é para validar o fluxo gateway->catalog sem dependências externas.

name: orderhub

services:

  # ─── Keycloak ─────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: orderhub-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin      # dev only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin      # dev only
      KC_HOSTNAME: http://localhost:8180      # stable issuer for tokens issued via the host
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true" # containers reach Keycloak as keycloak:8080
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/orderhub-realm.json:/opt/keycloak/data/import/orderhub-realm.json:ro
    ports:
      - "8180:8080"

  # ─── Catalog ────────────────────────────────────────────────────────────────
  catalog:
    build:
      context: ..
      dockerfile: src/Catalog/OrderHub.Catalog.Api/Dockerfile
    container_name: orderhub-catalog
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  # ─── Gateway (YARP) ─────────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/OrderHub.Gateway/Dockerfile
    container_name: orderhub-gateway
    ports:
      - "5000:8080"
    depends_on:
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped
