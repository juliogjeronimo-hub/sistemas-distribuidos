# ─── Serviços .NET: Catalog e Gateway (hello world) ───────────────────────────
# Para subir todo o stack infra + serviços, use docker-compose.services.yml.
# Este arquivo é para validar o fluxo gateway->catalog sem dependências externas.

name: orderhub

services:

  # ─── Catalog ────────────────────────────────────────────────────────────────
  catalog:
    build:
      context: ..
      dockerfile: src/Catalog/OrderHub.Catalog.Api/Dockerfile
    container_name: orderhub-catalog
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  # ─── Gateway (YARP) ─────────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/OrderHub.Gateway/Dockerfile
    container_name: orderhub-gateway
    ports:
      - "5000:8080"
    depends_on:
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped
